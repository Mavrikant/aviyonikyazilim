name: GitHub Pages'e Dağıt

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      indexnow-tumu:
        description: "IndexNow'a yalnızca değişen sayfaları değil, sitemap'teki tüm sayfaları bildir"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Derle
    runs-on: ubuntu-latest
    # Olağan süre birkaç dakikadır; asılı kalan bir adım yayın kuyruğunu saatlerce tutmasın.
    timeout-minutes: 15
    outputs:
      # Dağıtımdan sonra IndexNow'a bildirilecek adresler (satır başına bir adres).
      indexnow: ${{ steps.indexnow.outputs.adresler }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
        with:
          # Tüm geçmiş: sitemap'teki <lastmod> tarihleri her dosyanın son commit'inden okunur.
          fetch-depth: 0
      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Bağımlılıkları yükle
        run: npm ci
      - name: Siteyi derle
        run: npm run build
        env:
          # İsteğe bağlı: Settings → Secrets and variables → Actions → Variables.
          # Tanımlı değilse build'e analitik, doğrulama etiketi ya da canlı sohbet düğmesi
          # eklenmez (bkz. SEO.md, "Depo değişkenleri").
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          TAWK_TO_ID: ${{ vars.TAWK_TO_ID }}
      - name: PDF için Chromium'u kur
        # Sürüm, package-lock.json'daki playwright-core ile sabittir; --with-deps sistem
        # kitaplıklarını ve yedek yazı tiplerini de kurar.
        run: npx playwright-core install --with-deps chromium-headless-shell
      - name: Kitap PDF'ini üret
        # build/ altına yazar; ana sayfadaki "PDF indir" düğmesi bu dosyaya bağlanır.
        run: npm run pdf
      - name: IndexNow'a bildirilecek sayfaları belirle
        id: indexnow
        # Yeni derlemenin sitemap'ini yayındakiyle karşılaştırır: yeni, güncellenmiş ve
        # kaldırılmış sayfalar. İlk bildirimde ya da elle çalıştırmada "tüm sayfalar"
        # seçilirse sitemap'in tamamı bildirilir. Yayındaki site okunamazsa yalnızca uyarır.
        env:
          TUMU: ${{ inputs.indexnow-tumu && '--tumu' || '' }}
        run: |
          node scripts/indexnow.mjs liste $TUMU > "$RUNNER_TEMP/indexnow.txt"
          {
            echo 'adresler<<INDEXNOW_EOF'
            cat "$RUNNER_TEMP/indexnow.txt"
            echo 'INDEXNOW_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Pages yapılandır
        uses: actions/configure-pages@v6
      - name: Yapıyı yükle
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Yayınla
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: IndexNow'a bildir
    # Sayfalar ve anahtar dosyası yayındayken çalışır; adresleri Bing, Yandex ve diğer
    # IndexNow arama motorlarına iletir (Google IndexNow'u desteklemez, sitemap'i okur).
    needs: [build, deploy]
    if: needs.build.outputs.indexnow != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Değişen sayfaları bildir
        env:
          ADRESLER: ${{ needs.build.outputs.indexnow }}
        run: printf '%s\n' "$ADRESLER" | node scripts/indexnow.mjs gonder
