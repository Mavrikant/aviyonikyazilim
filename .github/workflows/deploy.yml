name: GitHub Pages'e Dağıt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Derle
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
        with:
          # Tüm geçmiş: sitemap'teki <lastmod> tarihleri her dosyanın son commit'inden okunur.
          fetch-depth: 0
      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Bağımlılıkları yükle
        run: npm ci
      - name: Siteyi derle
        run: npm run build
        env:
          # İsteğe bağlı: Settings → Secrets and variables → Actions → Variables.
          # Tanımlı değilse build'e analitik, doğrulama etiketi ya da canlı sohbet düğmesi
          # eklenmez (bkz. SEO.md, "Depo değişkenleri").
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          TAWK_TO_ID: ${{ vars.TAWK_TO_ID }}
      - name: PDF için Chromium'u kur
        # Sürüm, package-lock.json'daki playwright-core ile sabittir; --with-deps sistem
        # kitaplıklarını ve yedek yazı tiplerini de kurar.
        run: npx playwright-core install --with-deps chromium-headless-shell
      - name: Kitap PDF'ini üret
        # build/ altına yazar; ana sayfadaki "PDF indir" düğmesi bu dosyaya bağlanır.
        run: npm run pdf
      - name: Pages yapılandır
        uses: actions/configure-pages@v6
      - name: Yapıyı yükle
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Yayınla
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v5
