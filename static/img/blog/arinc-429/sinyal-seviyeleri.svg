<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="439" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <!-- alıcı bantları -->
  <rect x="92" y="57" width="648" height="71.5" fill="#e3f2e1"/>
  <rect x="92" y="172.5" width="648" height="55" fill="#eeeeee"/>
  <rect x="92" y="271.5" width="648" height="71.5" fill="#e1ecf7"/>
  <!-- verici seviyeleri -->
  <line x1="92" y1="90" x2="740" y2="90" stroke="#888" stroke-dasharray="5 4"/>
  <line x1="92" y1="310" x2="740" y2="310" stroke="#888" stroke-dasharray="5 4"/>
  <line x1="92" y1="200" x2="740" y2="200" stroke="#bbb"/>
  <!-- eksen etiketleri -->
  <g font-size="12" fill="#333" text-anchor="end">
    <text x="86" y="61">+13 V</text>
    <text x="86" y="94">+10 V</text>
    <text x="86" y="132">+6,5 V</text>
    <text x="86" y="176">+2,5 V</text>
    <text x="86" y="204">0 V</text>
    <text x="86" y="231">−2,5 V</text>
    <text x="86" y="275">−6,5 V</text>
    <text x="86" y="314">−10 V</text>
    <text x="86" y="347">−13 V</text>
  </g>
  <!-- bant adları (boşluk bölgesinde) -->
  <g font-size="12" fill="#2d5a27" text-anchor="middle">
    <text x="570" y="78">HI bölgesi</text>
    <text x="570" y="122">+6,5 … +13 V</text>
  </g>
  <text x="570" y="185" font-size="12" fill="#555" text-anchor="middle">NULL bölgesi ±2,5 V</text>
  <g font-size="12" fill="#1f4e79" text-anchor="middle">
    <text x="570" y="292">LO bölgesi</text>
    <text x="570" y="335">−6,5 … −13 V</text>
  </g>
  <!-- dalga şekli -->
  <path d="M92,200 L100,200 L105,90 L140,90 L145,200 L180,200 L185,310 L220,310 L225,200 L260,200 L265,90 L300,90 L305,200 L340,200 L345,90 L380,90 L385,200 L420,200 L425,310 L460,310 L465,200 L640,200 L645,90 L680,90 L685,200 L740,200" fill="none" stroke="#1f4e79" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- boşluğun kısaltıldığını gösteren kırık işareti -->
  <rect x="604" y="193" width="10" height="14" fill="#eeeeee"/>
  <line x1="601" y1="207" x2="607" y2="193" stroke="#1f4e79" stroke-width="1.5"/>
  <line x1="611" y1="207" x2="617" y2="193" stroke="#1f4e79" stroke-width="1.5"/>
  <!-- bit süresi -->
  <g stroke="#333" stroke-width="1">
    <line x1="180" y1="34" x2="180" y2="46"/>
    <line x1="260" y1="34" x2="260" y2="46"/>
    <line x1="182" y1="40" x2="258" y2="40"/>
    <path d="M182,40 l6,-3 v6 z M258,40 l-6,-3 v6 z" fill="#333"/>
  </g>
  <text x="220" y="27" font-size="13" fill="#222" text-anchor="middle">1 bit = 10 µs</text>
  <!-- kelime arası boşluk -->
  <g stroke="#333" stroke-width="1">
    <line x1="500" y1="34" x2="500" y2="46"/>
    <line x1="640" y1="34" x2="640" y2="46"/>
    <line x1="502" y1="40" x2="638" y2="40"/>
    <path d="M502,40 l6,-3 v6 z M638,40 l-6,-3 v6 z" fill="#333"/>
  </g>
  <text x="570" y="27" font-size="13" fill="#222" text-anchor="middle">kelime arası boşluk ≥ 4 bit</text>
  <!-- yarım bit -->
  <g stroke="#333" stroke-width="1">
    <line x1="100" y1="354" x2="100" y2="366"/>
    <line x1="142" y1="354" x2="142" y2="366"/>
    <line x1="102" y1="360" x2="140" y2="360"/>
    <path d="M102,360 l6,-3 v6 z M140,360 l-6,-3 v6 z" fill="#333"/>
  </g>
  <text x="121" y="380" font-size="12" fill="#222" text-anchor="middle">darbe: yarım bit (5 µs)</text>
  <!-- bit değerleri -->
  <g font-size="15" font-weight="600" fill="#1f4e79" text-anchor="middle">
    <text x="140" y="404">1</text>
    <text x="220" y="404">0</text>
    <text x="300" y="404">1</text>
    <text x="380" y="404">1</text>
    <text x="460" y="404">0</text>
    <text x="680" y="404">1</text>
  </g>
  <text x="680" y="380" font-size="12" fill="#222" text-anchor="middle">sonraki kelime</text>
  <text x="92" y="428" font-size="11.5" fill="#555">Kesikli çizgi: verici seviyesi (±10 V) · Renkli bantlar: alıcının HI, NULL ve LO aralıkları (A–B fark gerilimi)</text>
</svg>
