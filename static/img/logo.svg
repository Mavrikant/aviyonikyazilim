<svg width="64" height="64" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aviyonik Yazılım logosu: yapay ufuk göstergesi">
  <defs>
    <clipPath id="face">
      <circle cx="100" cy="100" r="82"/>
    </clipPath>
    <clipPath id="card">
      <circle cx="100" cy="100" r="66"/>
    </clipPath>
    <linearGradient id="bezel" x1="100" y1="2" x2="100" y2="198" gradientUnits="userSpaceOnUse">
      <stop stop-color="#454B54"/>
      <stop offset="0.5" stop-color="#262A30"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="lip" x1="100" y1="14" x2="100" y2="186" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07090B"/>
      <stop offset="1" stop-color="#30363E"/>
    </linearGradient>
    <linearGradient id="sky" x1="100" y1="34" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A7BCF"/>
      <stop offset="1" stop-color="#3D93E2"/>
    </linearGradient>
    <linearGradient id="ground" x1="100" y1="100" x2="100" y2="166" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93602F"/>
      <stop offset="1" stop-color="#6A421F"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="97" x2="0" y2="103" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD978"/>
      <stop offset="1" stop-color="#E9A832"/>
    </linearGradient>
    <radialGradient id="screw" cx="0.38" cy="0.32" r="0.8">
      <stop stop-color="#6A717B"/>
      <stop offset="1" stop-color="#1A1D21"/>
    </radialGradient>
    <radialGradient id="vignette" cx="100" cy="100" r="82" gradientUnits="userSpaceOnUse">
      <stop offset="0.82" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="glare" x1="100" y1="18" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Gösterge gövdesi: çerçeve (bezel), iç dudak ve 45° köşegenlerdeki vidalar -->
  <circle cx="100" cy="100" r="98" fill="url(#bezel)"/>
  <circle cx="100" cy="100" r="97.2" stroke="#fff" stroke-opacity="0.1" stroke-width="1.2"/>
  <circle cx="100" cy="100" r="85.5" fill="url(#lip)"/>
  <g stroke="#0A0B0D">
    <g transform="translate(35.12 35.12) rotate(20)"><circle r="5" fill="url(#screw)" stroke-width="0.8"/><path d="M-3.1 0 H3.1 M0 -3.1 V3.1" stroke-width="1.8" stroke-linecap="round"/></g>
    <g transform="translate(164.88 35.12) rotate(-25)"><circle r="5" fill="url(#screw)" stroke-width="0.8"/><path d="M-3.1 0 H3.1 M0 -3.1 V3.1" stroke-width="1.8" stroke-linecap="round"/></g>
    <g transform="translate(164.88 164.88) rotate(65)"><circle r="5" fill="url(#screw)" stroke-width="0.8"/><path d="M-3.1 0 H3.1 M0 -3.1 V3.1" stroke-width="1.8" stroke-linecap="round"/></g>
    <g transform="translate(35.12 164.88) rotate(5)"><circle r="5" fill="url(#screw)" stroke-width="0.8"/><path d="M-3.1 0 H3.1 M0 -3.1 V3.1" stroke-width="1.8" stroke-linecap="round"/></g>
  </g>

  <g clip-path="url(#face)">
    <!-- Yatış halkası: üst yarı gökyüzü, alt yarı yer -->
    <rect width="200" height="100" fill="#1B5AA6"/>
    <rect y="100" width="200" height="100" fill="#583619"/>

    <!-- Ufuk kartı ve yunuslama merdiveni (±10°, ±20°) -->
    <g clip-path="url(#card)">
      <rect width="200" height="100" fill="url(#sky)"/>
      <rect y="100" width="200" height="100" fill="url(#ground)"/>
      <path d="M83 75 H117 M83 50 H117 M83 125 H117 M83 150 H117" stroke="#F4F8FC" stroke-width="2.7" stroke-linecap="round"/>
    </g>
    <circle cx="100" cy="100" r="66" stroke="#000" stroke-opacity="0.3" stroke-width="1.2"/>

    <!-- Ufuk çizgisi -->
    <path d="M0 100 H200" stroke="#F4F8FC" stroke-width="3.1"/>

    <!-- Yatış skalası: 10°/20° kısa, 30°/60° uzun, 45° üçgen -->
    <g stroke="#F4F8FC">
      <path d="M100 27.5 V19" transform="rotate(-10 100 100)" stroke-width="2.3"/>
      <path d="M100 27.5 V19" transform="rotate(10 100 100)" stroke-width="2.3"/>
      <path d="M100 27.5 V19" transform="rotate(-20 100 100)" stroke-width="2.3"/>
      <path d="M100 27.5 V19" transform="rotate(20 100 100)" stroke-width="2.3"/>
      <path d="M100 32.5 V19" transform="rotate(-30 100 100)" stroke-width="3.5"/>
      <path d="M100 32.5 V19" transform="rotate(30 100 100)" stroke-width="3.5"/>
      <path d="M100 32.5 V19" transform="rotate(-60 100 100)" stroke-width="3.5"/>
      <path d="M100 32.5 V19" transform="rotate(60 100 100)" stroke-width="3.5"/>
    </g>
    <path d="M97.2 19.5 H102.8 L100 26 Z" transform="rotate(-45 100 100)" fill="#F4F8FC"/>
    <path d="M97.2 19.5 H102.8 L100 26 Z" transform="rotate(45 100 100)" fill="#F4F8FC"/>

    <!-- Kenar gölgesi ve cam yansıması -->
    <circle cx="100" cy="100" r="82" fill="url(#vignette)"/>
    <path d="M18 100 A82 82 0 0 1 182 100 Z" fill="url(#glare)"/>
  </g>

  <!-- Sabit semboller: yatış göstergesi üçgeni, ufuk referans çubukları, minyatür uçak -->
  <g filter="url(#shadow)">
    <path d="M94 18.5 H106 L100 32 Z" fill="#F4F8FC"/>
    <rect x="49" y="97.2" width="29" height="5.6" rx="1.4" fill="url(#bar)" stroke="#1E1404" stroke-width="1.2"/>
    <rect x="122" y="97.2" width="29" height="5.6" rx="1.4" fill="url(#bar)" stroke="#1E1404" stroke-width="1.2"/>
    <path d="M78 100 L95 97.6 H105 L122 100 L105 102.4 H95 Z" fill="#FFFFFF"/>
    <rect x="98.35" y="90" width="3.3" height="10" rx="1.65" fill="#FFFFFF"/>
    <path d="M94.9 101.5 L100 111 L105.1 101.5 Z" fill="#FFFFFF"/>
    <circle cx="100" cy="100" r="6.6" fill="#FFFFFF"/>
  </g>
  <circle cx="100" cy="100" r="82" stroke="#05070A" stroke-width="1.6"/>
</svg>
